name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-check:
    name: 服务端语法检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 语法检查（node --check）
        run: find . -name '*.js' -not -path './node_modules/*' -exec node --check {} \;

  web-build:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 构建
        run: npm run build
